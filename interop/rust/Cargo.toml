[package]
name = "fiber-lsp-sdk-interop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
musig2 = { version = "0.2.4", features = ["secp256k1", "serde"] }
secp256k1 = { version = "0.29", features = ["global-context"] }
ckb-hash = "0.115"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[workspace]
