name: Interop vectors

on:
  workflow_dispatch:
  pull_request:
    paths:
      - interop/**
      - src/derivation/**
      - test/**

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust/target
          key: cargo-${{ hashFiles('interop/rust/Cargo.lock') }}
      - run: cargo run --release --manifest-path interop/rust/Cargo.toml -- gen-vectors interop/vectors/vectors.json
      # The committed vectors must be exactly what the harness produces: a diff here
      # means a derivation changed without the vectors being regenerated, or the
      # other way round.
      - run: git diff --exit-code interop/vectors/vectors.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
